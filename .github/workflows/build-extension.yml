name: Build & Package Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Extension
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nso-extension
          path: dist/
          retention-days: 30

      - name: Publish a release for a new main-branch version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          node build.js --zip
          gh release create "$TAG" nso-extension-backend.zip \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Package & Release on GitHub Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node build.js --zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nso-extension-backend.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
